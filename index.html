<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<title>Ben Crossman Web Design and Development</title>
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<meta name="description" content="Bespoke, accessible WordPress design, custom theme development and website auditing by Ben Crossman, fixing broken sites, working remotely with museums, arts organisations and clients worldwide." />
	<link rel="canonical" href="https://scannermobs.github.io/" />
	<link href="https://cdn.jsdelivr.net/npm/modern-normalize@v3.0.0/modern-normalize.min.css" rel="stylesheet">
	<link rel="icon" href="favicon.png">
	<script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
	<style>
		html{
			height: 100%;
		}
		body{
			background: linear-gradient(45deg, #333, #444);
			color: #f1ebdabf;
			line-height: 1.5;
			height: 100%;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: flex-start;
			padding: 3vh 3vw;
		}
		h1{
			font-size: clamp(2.5rem, 0.5rem + 5vw, 4.5rem);
			line-height: 1.05;
		}
		p{
			font-size: clamp(1rem, 0.5rem + 2.5vw, 1.5rem);
		}
		#email{
			cursor: pointer;
			appearance: none;
			background: transparent;
			color: inherit;
			border: none;
			text-decoration: underline;
		}
		#email.showing{
			text-decoration: none;
		}
		button{
			padding: 0;
		}
	</style>
</head>
<body>
	
	<h1>Bespoke, Accessible, and Down-to-Earth WordPress Design & Development</h1>
	<p>My name's Ben Crossman and I have over 15 years experience designing, developing, auditing (and fixing) websites.<br> 
	I work remotely and with clients from around the world.</p>
	<p>If you'd like to discuss a project, please <button id="email" onclick="revealEmail()">contact me</button>.</p>
	
	<script>
		function revealEmail() {
			const encodedEmail = 'contact me by emailing: ben.r.crossman' + '@' + 'gmail' + '.com'
			const emailElement = document.getElementById('email')
			emailElement.classList.add('showing')
			emailElement.innerText = encodedEmail
			emailElement.style.cursor = 'text'
			const range = document.createRange()
			range.selectNode(emailElement)
			const selection = window.getSelection()
			selection.removeAllRanges()
			selection.addRange(range)
		}
	</script>

</body>
</html>
